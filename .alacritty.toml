[window]

opacity = 0.8

padding.x = 0
padding.y = 0

[font]
normal.family = "FiraCode Nerd Font Propo"
normal.style = "Retina"
bold.family = "FiraCode Nerd Font Propo"
italic.family = "FiraCode Nerd Font Propo"
bold_italic.family = "FiraCode Nerd Font Propo"

size = 13.8

[[keyboard.bindings]]
action = "ToggleViMode"
mode = "AppCursor"
key = "v"
mods = "Alt"

[[keyboard.bindings]]
action = "ToggleViMode"
mode = "Vi"
key = "Escape"

# tango + solarized dark theme
[colors.primary]
background = '#000000'
foreground = '#d3d7cf'

# Normal colors
[colors.normal]
black   = '#073642'
red     = '#dc322f'
green   = '#859900'
yellow  = '#b58900'
blue    = '#268bd2'
magenta = '#d33682'
cyan    = '#2aa198'
white   = '#eee8d5'

# Bright colors
[colors.bright]
black   = '#002b36'
red     = '#cb4b16'
green   = '#586e75'
yellow  = '#657b83'
blue    = '#839496'
magenta = '#6c71c4'
cyan    = '#93a1a1'
white   = '#fdf6e3'

