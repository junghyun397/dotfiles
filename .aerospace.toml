after-login-command = []
after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = 'move-mouse monitor-lazy-center'

key-mapping.preset = 'qwerty'

[exec]
inherit-env-vars = true  # If you don't touch "exec" section,
env-vars.PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[mode.main.binding]
alt-d = 'exec-and-forget open -n /Applications/Alacritty.app'
alt-b = 'exec-and-forget open -n "/Applications/Chromium.app"'
alt-shift-b = 'exec-and-forget open -n "/Applications/Chromium.app" --args --incognito'

alt-slash = 'layout tiles horizontal vertical'
alt-o = 'layout horizontal vertical'
alt-comma = 'macos-native-minimize'

alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

alt-shift-h = 'join-with left'
alt-shift-j = 'join-with down'
alt-shift-k = 'join-with up'
alt-shift-l = 'join-with right'

alt-space = 'mode select'

alt-backtick = 'workspace quote'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'

alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'
alt-minus = 'workspace dash'

alt-shift-backtick = ['move-node-to-workspace quote', 'workspace quote']
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']

alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']

alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 0', 'workspace 0']
alt-shift-minus = ['move-node-to-workspace dash', 'workspace dash']
alt-shift-equal = ['move-node-to-workspace equal', 'workspace equal']

alt-tab = 'workspace-back-and-forth'

[workspace-to-monitor-force-assignment]
quote = ['ultragear', 'main']
1 = ['ultragear', 'main']
2 = ['ultragear', 'main']
3 = ['ultragear', 'main']
4 = ['ultragear', 'main']

5 = ['built-in', 'secondary']
6 = ['built-in', 'secondary']
7 = ['built-in', 'secondary']

8 = ['kuycon', 'secondary']
9 = ['kuycon', 'secondary']
0 = ['kuycon', 'secondary']
dash = ['kuycon', 'secondary']
equal = ['kuycon', 'secondary']

[mode.select.binding]
h = 'move left'
j = 'move down'
k = 'move up'
l = 'move right'

shift-h = 'resize width -50'
shift-j = 'resize height +50'
shift-k = 'resize height -50'
shift-l = 'resize width +50'

enter = 'mode main'
esc = 'mode main'

